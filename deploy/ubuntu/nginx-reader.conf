server {
    listen 80;
    server_name reader.xiaopan631.cn;
    root /var/www/novel-reader;
    index index.html;
    client_max_body_size 25m;

    # server 上下文：统一把 429 渲染成 JSON（含 Retry-After）
    include snippets/novel-ratelimit-429.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location ^~ /api/admin/ { return 404; }

    # 认证类：慢哈希接口，单独一档严格限流
    location ^~ /api/front/auth/ {
        include snippets/novel-proxy.conf;
        include snippets/novel-ratelimit-auth.conf;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # TXT 导入：重型接口。批量插入改造前 15s 会掐断正常导入，这里单独放宽超时。
    location ^~ /api/front/me/imports {
        include snippets/novel-proxy.conf;
        include snippets/novel-ratelimit-import.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/ {
        include snippets/novel-proxy.conf;
        include snippets/novel-ratelimit-api.conf;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
