# Temporary reader-only IP preview. Replace YOUR_PUBLIC_IP before enabling.
# Keep the ECS security group's port 80 restricted to the same IP.
#
# 国内节点在备案通过前，公网 80 会被云厂商拦截（返回备案提示页），
# 这时候用 SSH 隧道验证最稳，本机执行：
#   ssh -L 8081:127.0.0.1:80 root@<ECS公网IP>
# 然后浏览器打开 http://localhost:8081 。因此这里必须放行 127.0.0.1。
server {
    listen 80 default_server;
    server_name _;
    root /var/www/novel-reader;
    index index.html;
    client_max_body_size 25m;

    allow 127.0.0.1;
    allow YOUR_PUBLIC_IP;
    deny all;

    location ^~ /api/admin/ { return 404; }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 与其他站点保持一致：覆盖写入，避免客户端自带 XFF 伪造来源 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
