server {
    listen 80;
    server_name admin.reader.example.com;
    root /var/www/novel-manager;
    index index.html;
    client_max_body_size 25m;

    # server 上下文：统一把 429 渲染成 JSON（含 Retry-After）
    include snippets/novel-ratelimit-429.conf;

    auth_basic "Novel management";
    auth_basic_user_file /etc/nginx/novel-manager.htpasswd;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/letsencrypt;
    }

    # 管理端登录：单独一档严格限流。
    # auth_basic off 必须保留 —— server 级有 Basic Auth，否则登录接口会被要求二次认证。
    location ^~ /api/admin/auth/ {
        auth_basic off;
        include snippets/novel-proxy.conf;
        include snippets/novel-ratelimit-auth.conf;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location ^~ /api/ {
        # Axios sends the admin JWT in Authorization, so Basic Auth applies to the UI only.
        auth_basic off;
        include snippets/novel-proxy.conf;
        include snippets/novel-ratelimit-api.conf;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
