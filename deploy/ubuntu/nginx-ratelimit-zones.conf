# 安装位置：/etc/nginx/conf.d/nginx-ratelimit-zones.conf
# 上下文：http {} —— Debian/Ubuntu 的 nginx.conf 会 include /etc/nginx/conf.d/*.conf，
# 所以本文件顶层就是 http 上下文。不要放进 sites-enabled/（那里是 server 上下文），
# 否则会报 "limit_req_zone directive is not allowed here"。
#
# 关键：这个文件只能被加载一次。5 个站点配置都通过 include snippets 复用下面这些 zone，
# 不要在每个 server 块里重复定义 zone（会报 duplicate / zone already exists）。
#
# ============================================================================
# 阈值设计基准（本次改动的核心）
# ============================================================================
# Nginx 只能看到 IP，看不到用户身份，所以一个阈值天然是「一个出口 IP」共用的。
# 国内真实场景里，一个出口后面常常站着几十人：
#   - 宿舍 / 实验室 / 公司：30~100 人共用一个 NAT 公网 IP
#   - 移动网络 / 部分宽带：运营商级 NAT（100.64.0.0/10），背后可能几百人
#
# 因此下面所有阈值按「50 人共用同一出口」估算，再留余量：
#   普通读接口：人均 0.5~1 r/s，50 人约 25~50 r/s     -> 取 40r/s
#   认证接口：  开班同时登录，50 人一次性 50 次       -> 取 80r/m
#   连接数：    浏览器单域名并发约 4~6 条，50 人约 200~300 -> 取 200
#
# 调大阈值不等于放弃防护：脚本撞库是每分钟上千次量级，40r/s 与 80r/m 依然能挡住；
# 而 50 人的宿舍再也不会被误伤。真正的「按人公平」由后端 L3 的 uid 维度负责，
# Nginx 这一层只做粗网。若规模明显变化（比如全校上千人共用），按比例再乘即可。
# ============================================================================

# 通用 API：平均 40 请求/秒，location 里再配 burst=80。
# $binary_remote_addr 是二进制 IP，IPv4 只占 4 字节，比 $remote_addr 字符串省内存。
limit_req_zone $binary_remote_addr zone=novel_api:10m rate=40r/s;

# 认证类（登录 / 注册 / 验证码 / 管理端登录）：80 请求/分钟。
# 定位是「抑制撞库和验证码刷取」。Nginx 看不到密码校验结果，
# 所以「连续失败 5 次锁定账号」必须由 L4 后端用 Redis 计数实现，不能写在这一层。
limit_req_zone $binary_remote_addr zone=novel_auth:10m rate=80r/m;

# TXT 导入：20MB 文件全堆解析 + 逐条入库，是本项目最重的接口，单独一档。
# 导入是少数人偶发操作，不存在「全班同时导入」，所以这里保持严格。
# 注意 6r/m 只是按 IP 的次数限制；「全站同时最多 2 个导入」属于并发控制，
# 要由 L4 在 JVM 内用 Semaphore(2) 实现，Nginx 的 limit_conn 只能限制单 IP 连接数。
limit_req_zone $binary_remote_addr zone=novel_import:10m rate=6r/m;

# 并发连接数上限。limit_req 管「单位时间次数」，limit_conn 管「同一瞬间几条连接」，
# 两者互补，不能互相替代。具体数值在各 location 里指定（api / auth 不同）。
limit_conn_zone $binary_remote_addr zone=novel_conn:10m;
