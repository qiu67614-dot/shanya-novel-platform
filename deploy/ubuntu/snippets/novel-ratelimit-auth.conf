# 在 /api/front/auth/ 或 /api/admin/auth/ location 内 include。
# 认证接口含 BCrypt 慢哈希（约 100ms/次），是天然的 CPU 放大器。
# 但阈值仍按「50 人共用出口」估算：开班时全班同时登录，50 次一次性打进来，
# 所以 burst 必须容得下这个量，否则真实用户会被自己的同学挤掉。
# 80r/m + burst=30 = 一次能扛 30 个并发登录，之后每秒补 1.33 个，够 50 人班级使用。
# 撞库脚本是每分钟上千次量级，这个阈值依然拦得住。
limit_req zone=novel_auth burst=30 nodelay;
limit_req_status 429;
limit_conn_status 429;
limit_conn novel_conn 40;
