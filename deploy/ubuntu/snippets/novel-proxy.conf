# 在 location {} 内 include。所有 /api/... location 共用这一份反代设置。
# proxy_pass 末尾的 / 会去掉 /api 前缀：/api/front/books/home -> /front/books/home，
# 新增的分级 location（auth / imports）必须保持同样的写法，否则后端路径会多出 /api。
proxy_pass http://127.0.0.1:8080/;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# 安全修正：原来各 conf 用的是 $proxy_add_x_forwarded_for（追加式），
# 它会保留客户端自己传来的 XFF 值。后端若取 XFF 第一段当 IP，攻击者随便设个头
# 就能无限换身份绕过限流。改成 $remote_addr 覆盖写入，客户端无法伪造。
proxy_set_header X-Forwarded-For $remote_addr;

# 后端 L2 全局闸门只信任这一个头（由 Nginx 覆盖写入），不要去解析 XFF 链。
proxy_set_header X-Client-IP $remote_addr;

proxy_connect_timeout 3s;

# 注意：proxy_read_timeout / proxy_send_timeout 故意不写在这里。
# Nginx 不允许同一上下文重复定义同一指令，而导入接口需要 120s、其他接口 15s，
# 所以这两个超时由各 location 自己声明（见 nginx-*.conf）。
