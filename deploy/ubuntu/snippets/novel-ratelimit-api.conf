# 在普通 /api/ location 内 include。
# burst=20 是突发额度，nodelay 表示超出平均速率的突发立即放行、再超的直接拒绝；
# 不加 nodelay 的话请求会被排队延迟处理，用户感觉是「网站变卡」而不是「偶尔被拒」。
limit_req zone=novel_api burst=20 nodelay;

# limit_req / limit_conn 默认返回 503，前端会误判成服务挂了，必须显式改成 429。
limit_req_status 429;
limit_conn_status 429;

limit_conn novel_conn 20;
