# 在普通 /api/ location 内 include。
# 阈值按「50 人共用同一出口 IP」设计，不是按单个人：
#   burst=80 允许 50 人同时点开一本书（首页会并发拉书单、榜单、分类）而不被拒。
# nodelay 表示突发额度内立即放行、再超的直接拒绝；不加 nodelay 的话超出部分会被
# 排队延迟，虽然不报错但会占住连接，对共享 IP 反而更容易堆出雪崩。
limit_req zone=novel_api burst=80 nodelay;

# limit_req / limit_conn 默认返回 503，前端会误判成服务挂了，必须显式改成 429。
limit_req_status 429;
limit_conn_status 429;

# 浏览器对单域名通常并发 4~6 条，50 人约 200~300 条。取 200 是「挡单机洪水」的下限，
# 不追求压满；真要防 slowloris 这类长连接攻击，靠的是连接寿命而不是把这个数调小。
limit_conn novel_conn 200;
