# 在 server {} 内 include（不是 location 内）。
# error_page 与 named location 都属于 server 上下文；同一 server 内只需 include 一次。
# named location 名字在同一 server 内唯一即可，不同 server 之间可以重名。
error_page 429 = @novel_ratelimited;

location @novel_ratelimited {
    # Nginx 默认吐一段 HTML，axios 拿到字符串后 error.response.data.message 是 undefined。
    # 这里统一渲染成前端能解析的 JSON，契约见 docs/reader-api.md。
    default_type "application/json; charset=utf-8";
    add_header Retry-After 3 always;
    add_header Cache-Control "no-store" always;
    return 429 '{"code":"A0429","data":null,"message":"操作过于频繁，请 3 秒后重试"}';
}
